name: Deploy PR Preview

# This workflow runs when a PR is opened, updated, or closed
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Required permissions for the action to push to the branch and leave a PR comment
permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- START OF BUILD STEPS ---
      # Adjust these steps based on your static site generator (Hugo, Jekyll, Node.js, etc.)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies & Build
        run: |
          pip install -r requirements.txt
          pip install mystmd
          myst build

      # --- END OF BUILD STEPS ---

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_build/html
          preview-branch: gh-pages # The branch your GitHub Pages site is served from
          umbrella-dir: pr-preview # The subfolder where all previews will live
