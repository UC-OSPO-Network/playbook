name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies & Build
        env:
          # Custom domain routes directly from root, so omit /playbook
          BASE_URL: /pr-preview/pr-${{ github.event.number }}
        run: |
          pip install -r requirements.txt
          pip install mystmd
          myst build --html

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          custom-url: 'https://ucospo.net'
